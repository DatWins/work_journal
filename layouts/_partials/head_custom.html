<style>
  /* Lichess boards: full width, keep the board's shape on any screen */
  .lichess-embed { margin: 1.5rem 0; }
  .lichess-frame { position: relative; width: 100%; max-width: 760px; margin: 0 auto; aspect-ratio: 600 / 397; }
  .lichess-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .lichess-embed figcaption { text-align: center; font-size: .9rem; margin-top: .4rem; }

  /* Videos and other embeds never wider than the screen */
  .blog-post iframe, .blog-post video, .blog-post img { max-width: 100%; }

  /* Wide tables scroll sideways inside the post instead of stretching the page */
  .blog-post table { display: block; max-width: 100%; overflow-x: auto; }

  /* Phones: long words and links wrap instead of overflowing */
  .blog-post { overflow-wrap: break-word; }
  .blog-post table td, .blog-post table th { overflow-wrap: normal; }

  @media (max-width: 575.98px) {
    /* the round logo would sit on top of the site name, so hide it on phones */
    .navbar-custom .avatar-container { display: none; }
    .navbar-custom .navbar-brand { font-size: 1.05rem; }
    .blog-post h1, .page-heading h1, .post-heading h1 { font-size: 2rem; }
  }
</style>
