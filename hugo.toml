baseURL = "/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Work Journal"
theme = "beautifulhugo"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  includeNewer = true
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[Params]
  homeTitle = "📓Work Journal📓"
  subtitle = "Notes and journals from work"
  mainSections = ["post", "posts"]
  logo = "/img/logo.jpg"
  dateFormat = "January 2, 2006"
  wordCount = false
  readingTime = false
  rss = false
  showRelatedPosts = true
  socialShare = false
  hideAuthor = true
  colorScheme = "light"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/page/about/"
  weight = 2

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3

[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 4

[markup.highlight]
  noClasses = false
  lineNos = false

[markup.goldmark.renderer]
  unsafe = true
